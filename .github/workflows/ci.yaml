# vim: set ft=yaml :


name: 'CI'

on:
  push:

defaults:
  run:
    shell: 'sh -euo pipefail {0}'

permissions:
  contents: 'read'

jobs:
  ci:
    environment:
      name: 'bump-version'
      deployment: false
    runs-on: 'ubuntu-26.04'
    steps:
      - name: 'Create GitHub app token'
        id: 'app-token'
        if: 'github.ref_name == github.event.repository.default_branch'
        uses: 'actions/create-github-app-token@v3.2.0'
        with:
          client-id: '${{ vars.BUMP_VERSION_APP_CLIENT_ID }}'
          private-key: '${{ secrets.BUMP_VERSION_APP_PRIVATE_KEY }}'
          repositories: '${{ github.repository }}'
      - name: 'Checkout'
        uses: 'actions/checkout@v7.0.1'
        with:
          fetch-depth: 0
          token: '${{ steps.app-token.outputs.token }}'
      - name: 'mise setup'
        uses: 'jdx/mise-action@v4.2.3'
      - name: 'Check'
        run: 'mise run check'
      - name: 'Bump version'
        id: 'bump-version'
        env:
          BRANCH: '${{ github.ref_name }}'
          DEFAULT_BRANCH: '${{ github.event.repository.default_branch }}'
        run: |
          OLD_VERSION="$(mise run bump-my-version -- show -- current_version)"
          if [ "${BRANCH}" = "${DEFAULT_BRANCH}" ]; then
            COMMIT_SUBJECT="$(git log --format='format:%s' --max-count=1)"
            if printf '%s\n' "${COMMIT_SUBJECT}" | grep -Fq -- '[major]'; then
              VERSION_PART='major'
            elif printf '%s\n' "${COMMIT_SUBJECT}" | grep -Fq -- '[minor]'; then
              VERSION_PART='minor'
            else
              VERSION_PART='patch'
            fi
            mise run bump-my-version -- bump --verbose -- "${VERSION_PART}"
          else
            for VERSION_PART in 'patch' 'dev'; do
              mise run bump-my-version -- bump --verbose --allow-dirty -- "${VERSION_PART}"
            done
          fi
          NEW_VERSION="$(mise run bump-my-version -- show -- current_version)"
          TAG="v${NEW_VERSION}"
          TAG_MESSAGE="Bump version: ${OLD_VERSION} → ${NEW_VERSION} (automation)"
          COMMIT_MESSAGE="[ci skip] ${TAG_MESSAGE}"
          printf '%s\n' "tag=${TAG}" "tag-message=${TAG_MESSAGE}" "commit-message=${COMMIT_MESSAGE}" >> "${GITHUB_OUTPUT}"
      - name: 'Configure Git user'
        id: 'git-user'
        if: 'github.ref_name == github.event.repository.default_branch'
        env:
          APP_SLUG: '${{ steps.app-token.outputs.app-slug }}'
          GH_TOKEN: '${{ steps.app-token.outputs.token }}'
        run: |
          ACTOR="${APP_SLUG}[bot]"
          ACTOR_ID="$(gh api -- "/users/${ACTOR}" | jq -r -- '.id')"
          EMAIL="${ACTOR_ID}+${ACTOR}@users.noreply.github.com"
          git config set -- user.name "${ACTOR}"
          git config set -- user.email "${EMAIL}"
          printf '%s\n' "name=${ACTOR}" "email=${EMAIL}" >> "${GITHUB_OUTPUT}"
      - name: 'Commit bumped version'
        id: 'commit'
        if: 'github.ref_name == github.event.repository.default_branch'
        uses: 'IAreKyleW00t/verified-bot-commit@v2.3.3'
        with:
          auto-stage: true
          files: '**'
          if-no-commit: 'error'
          message: '${{ steps.bump-version.outputs.commit-message }}'
          token: '${{ steps.app-token.outputs.token }}'
          update-local: true
      - name: 'Tag bumped version'
        if: 'github.ref_name == github.event.repository.default_branch'
        env:
          COMMIT: '${{ steps.commit.outputs.commit }}'
          MESSAGE: '${{ steps.bump-version.outputs.tag-message }}'
          TAG: '${{ steps.bump-version.outputs.tag }}'
        run: |
          git tag --annotate --message="${MESSAGE}" -- "${TAG}" "${COMMIT}"
          git push -- "${TAG}"

# vim: set ft=yaml :


name: 'Renovate'

on:
  schedule:
    - cron: '0 5 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:


defaults:
  run:
    shell: 'sh -euo pipefail {0}'

permissions:
  contents: 'read'

jobs:

  renovate:
    name: 'Renovate'
    environment:
      name: 'renovate'
      deployment: false
    runs-on: 'ubuntu-26.04'
    steps:
      - name: 'Create GitHub app token'
        id: 'app-token'
        uses: 'actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc' # v3.4.0
        with:
          client-id: '${{ vars.RENOVATE_APP_CLIENT_ID }}'
          private-key: '${{ secrets.RENOVATE_APP_PRIVATE_KEY }}'
          owner: '${{ github.repository_owner }}'
          repositories: '${{ github.repository }}'
      - name: 'Checkout'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - name: 'Renovate'
        uses: 'renovatebot/github-action@ebcbb513d07ead4d9c0c2139064301db05e84a3e' # v46.3.15
        env:
          RENOVATE_ALLOWED_UNSAFE_EXECUTIONS: 'mise'
          RENOVATE_REPOSITORIES: '${{ github.repository }}'
        with:
          configurationFile: 'renovate.json'
          docker-cmd-file: '.github/renovate-entrypoint.sh'
          token: '${{ steps.app-token.outputs.token }}'
